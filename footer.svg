<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-label="Toka Nani — Design. Build. Deploy. Measure.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0B1120"/>
      <stop offset="0.5" stop-color="#111A2C"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="0.8" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#F9A8D4"/>
      <stop offset="1" stop-color="#BEF264"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0; 0.4 0; -0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="76" rx="12" fill="url(#bg)"/>
  <rect x="120" y="0" width="960" height="2" fill="url(#line)"/>
  <text x="48" y="45" fill="url(#brand)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">TOKA NANI</text>
  <text x="1152" y="45" text-anchor="end" fill="#7DD3FC" font-family="SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2.2">DESIGN  /  BUILD  /  DEPLOY  /  MEASURE</text>
</svg>
