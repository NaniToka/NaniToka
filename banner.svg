<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Toka Nani — Cloud &amp; GenAI Developer</title>
  <desc id="desc">Open to internships. Two live products on GCP, up to 70% token reduction benchmark, 48 passing CivicPulse tests, and 17+ hackathons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22C55E"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="tileStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1">
      <stop stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1">
      <stop stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1">
      <stop stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#E6EDF3" stroke-opacity="0.03"/>
    </pattern>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.50"/>
    </filter>
    <style>
      .sans { font-family: Inter, Poppins, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .name { font-size: 76px; font-weight: 800; letter-spacing: -3px; }
      .role { font-size: 27px; font-weight: 600; fill: #E6EDF3; }
      .copy { font-size: 18px; font-weight: 400; fill: #8B949E; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.65px; }
      .metric { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.05px; fill: #8B949E; }
      .micro { font-size: 10px; font-weight: 500; letter-spacing: 0.6px; fill: #8B949E; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <g>
    <ellipse cx="180" cy="80" rx="420" ry="280" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 35; -25 15; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1100" cy="300" rx="380" ry="250" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -50 -40; 25 -15; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="360" rx="300" ry="180" fill="url(#glowC)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -40 -25; 30 -10; 0 0" dur="21s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect width="1200" height="4" rx="2" fill="url(#accent)"/>

  <g class="sans">
    <rect x="64" y="42" width="262" height="32" rx="16" fill="#22C55E" fill-opacity="0.08" stroke="#22C55E" stroke-opacity="0.45"/>
    <circle cx="84" cy="58" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="84" cy="58" r="4" fill="none" stroke="#22C55E" stroke-width="1.5">
      <animate attributeName="r" values="4;13" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="62" class="eyebrow" fill="#86EFAC">OPEN TO INTERNSHIPS</text>

    <text x="60" y="157" class="name" fill="#E6EDF3">Toka <tspan fill="url(#accent)">Nani</tspan></text>
    <text x="64" y="199" class="role">Cloud &amp; GenAI Developer</text>
    <text x="64" y="241" class="copy">I build AI products that reduce cost, surface bias,</text>
    <text x="64" y="268" class="copy">and turn complex data into clear decisions.</text>

    <line x1="64" y1="303" x2="672" y2="303" stroke="#8B949E" stroke-opacity="0.25"/>
    <text x="64" y="329" class="mono micro">PYTHON  /  FASTAPI  /  REACT  /  GOOGLE CLOUD  /  DOCKER</text>
  </g>

  <g class="sans">
    <g filter="url(#tileShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="744" y="42" width="185" height="126" rx="14" fill="#161B22" fill-opacity="0.92" stroke="url(#tileStroke)"/>
      <rect x="744" y="42" width="3" height="126" rx="1.5" fill="#7C3AED"/>
      <text x="766" y="98" class="mono metric" fill="#A78BFA">02</text>
      <text x="766" y="127" class="label">LIVE PRODUCTS</text>
      <text x="766" y="146" class="label">ON GCP</text>
    </g>
    <g filter="url(#tileShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      <rect x="951" y="42" width="185" height="126" rx="14" fill="#161B22" fill-opacity="0.92" stroke="url(#tileStroke)"/>
      <rect x="951" y="42" width="3" height="126" rx="1.5" fill="#3B82F6"/>
      <text x="973" y="98" class="mono metric" fill="#60A5FA">70%</text>
      <text x="973" y="127" class="label">TOKEN REDUCTION*</text>
      <text x="973" y="146" class="label">TOKENFLOW BENCHMARK</text>
    </g>
    <g filter="url(#tileShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" begin="3s" repeatCount="indefinite"/>
      <rect x="744" y="190" width="185" height="126" rx="14" fill="#161B22" fill-opacity="0.92" stroke="url(#tileStroke)"/>
      <rect x="744" y="190" width="3" height="126" rx="1.5" fill="#22C55E"/>
      <text x="766" y="246" class="mono metric" fill="#4ADE80">48</text>
      <text x="766" y="275" class="label">PASSING TESTS</text>
      <text x="766" y="294" class="label">CIVICPULSE ENGINE</text>
    </g>
    <g filter="url(#tileShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" begin="4.5s" repeatCount="indefinite"/>
      <rect x="951" y="190" width="185" height="126" rx="14" fill="#161B22" fill-opacity="0.92" stroke="url(#tileStroke)"/>
      <rect x="951" y="190" width="3" height="126" rx="1.5" fill="#7C3AED"/>
      <text x="973" y="246" class="mono metric" fill="#A78BFA">17+</text>
      <text x="973" y="275" class="label">HACKATHONS</text>
      <text x="973" y="294" class="label">BUILD. LEARN. SHIP.</text>
    </g>
  </g>

  <text x="1136" y="340" text-anchor="end" class="mono micro">*TOKENFLOW AI · REPO BENCHMARK</text>
</svg>
