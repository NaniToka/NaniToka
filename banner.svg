<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Toka Nani, Cloud and GenAI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#0984e3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .sub { font: 500 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e8e6ff; letter-spacing: 4px; }
      .tag { font: 500 16px 'Courier New', monospace; fill: #dfe9ff; opacity: 0.9; }
      .float { animation: drift 6s ease-in-out infinite alternate; }
      .float2 { animation: drift 8s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translateY(0); } to { transform: translateY(12px); } }
    </style>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#glow)"/>
  <g opacity="0.14" fill="none" stroke="#ffffff" stroke-width="2">
    <circle class="float" cx="1040" cy="70" r="90"/>
    <circle class="float2" cx="1110" cy="190" r="55"/>
    <circle class="float" cx="120" cy="200" r="70"/>
  </g>
  <g opacity="0.18" fill="#ffffff">
    <circle cx="900" cy="40" r="4"/><circle cx="960" cy="120" r="3"/><circle cx="820" cy="190" r="5"/>
    <circle cx="260" cy="30" r="3"/><circle cx="330" cy="205" r="4"/>
  </g>
  <text x="600" y="115" text-anchor="middle" class="title">Toka Nani</text>
  <text x="600" y="158" text-anchor="middle" class="sub">CLOUD &amp; GENAI ENGINEER</text>
  <text x="600" y="198" text-anchor="middle" class="tag">&lt;/&gt; LLM cost optimization · responsible AI · Google Cloud</text>
</svg>
