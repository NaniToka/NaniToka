<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Toka Nani — Applied AI and Cloud Engineer</title>
  <desc id="desc">Open to internships. Four deployed AI products, ~40% token reduction in the published TokenFlow benchmark, 48 passing CivicPulse tests, and 13+ hackathons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.58" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.34" stop-color="#F472B6"/>
      <stop offset="0.67" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#A3E635"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0; 0.6 0; -0.6 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="tileStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1">
      <stop stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1">
      <stop stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1">
      <stop stop-color="#F472B6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowD" cx="0" cy="0" r="1">
      <stop stop-color="#A3E635" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#CBD5E1" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .name { font-size: 76px; font-weight: 800; letter-spacing: -3px; }
      .role { font-size: 27px; font-weight: 600; fill: #E2E8F0; }
      .copy { font-size: 18px; font-weight: 400; fill: #94A3B8; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.65px; }
      .metric { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.05px; fill: #94A3B8; }
      .micro { font-size: 10px; font-weight: 500; letter-spacing: 0.6px; fill: #64748B; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <g>
    <ellipse cx="190" cy="70" rx="430" ry="300" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 40; -30 20; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1110" cy="320" rx="400" ry="270" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 -50; 30 -20; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="640" cy="380" rx="330" ry="200" fill="url(#glowC)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -50 -30; 40 -15; 0 0" dur="21s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1010" cy="40" rx="260" ry="170" fill="url(#glowD)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="11s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect width="1200" height="4" rx="2" fill="url(#accent)"/>

  <g class="sans">
    <rect x="64" y="42" width="262" height="32" rx="16" fill="#A3E635" fill-opacity="0.08" stroke="#A3E635" stroke-opacity="0.45"/>
    <circle cx="84" cy="58" r="4" fill="#A3E635">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="84" cy="58" r="4" fill="none" stroke="#A3E635" stroke-width="1.5">
      <animate attributeName="r" values="4;13" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="62" class="eyebrow" fill="#D9F99D">OPEN TO INTERNSHIPS</text>

    <text x="60" y="157" class="name" fill="#F8FAFC">Toka <tspan fill="url(#accent)">Nani</tspan></text>
    <text x="64" y="199" class="role">Applied AI &amp; Cloud Engineer</text>
    <text x="64" y="241" class="copy">I build AI products that reduce cost, surface bias,</text>
    <text x="64" y="268" class="copy">and turn complex data into clear decisions.</text>

    <line x1="64" y1="303" x2="672" y2="303" stroke="#334155" stroke-opacity="0.7"/>
    <text x="64" y="329" class="mono micro" fill="#7E8BA3">GEMINI  /  VERTEX AI  /  CLOUD RUN  /  FASTAPI  /  REACT</text>
  </g>

  <g class="sans">
    <g filter="url(#tileShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="744" y="42" width="185" height="126" rx="14" fill="#111A2C" fill-opacity="0.92" stroke="url(#tileStroke)"/>
      <rect x="744" y="42" width="3" height="126" rx="1.5" fill="#A78BFA"/>
      <text x="766" y="98" class="metric" fill="#C4B5FD">04</text>
      <text x="766" y="127" class="label">DEPLOYED AI</text>
      <text x="766" y="146" class="label">PRODUCTS</text>
    </g>
    <g filter="url(#tileShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      <rect x="951" y="42" width="185" height="126" rx="14" fill="#111A2C" fill-opacity="0.92" stroke="url(#tileStroke)"/>
      <rect x="951" y="42" width="3" height="126" rx="1.5" fill="#22D3EE"/>
      <text x="973" y="98" class="metric" fill="#67E8F9">~40%</text>
      <text x="973" y="127" class="label">TOKEN REDUCTION*</text>
      <text x="973" y="146" class="label">PUBLISHED DATA*</text>
    </g>
    <g filter="url(#tileShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" begin="3s" repeatCount="indefinite"/>
      <rect x="744" y="190" width="185" height="126" rx="14" fill="#111A2C" fill-opacity="0.92" stroke="url(#tileStroke)"/>
      <rect x="744" y="190" width="3" height="126" rx="1.5" fill="#F472B6"/>
      <text x="766" y="246" class="metric" fill="#F9A8D4">48</text>
      <text x="766" y="275" class="label">PASSING TESTS</text>
      <text x="766" y="294" class="label">CIVICPULSE ENGINE</text>
    </g>
    <g filter="url(#tileShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" begin="4.5s" repeatCount="indefinite"/>
      <rect x="951" y="190" width="185" height="126" rx="14" fill="#111A2C" fill-opacity="0.92" stroke="url(#tileStroke)"/>
      <rect x="951" y="190" width="3" height="126" rx="1.5" fill="#A3E635"/>
      <text x="973" y="246" class="metric" fill="#BEF264">13+</text>
      <text x="973" y="275" class="label">HACKATHONS</text>
      <text x="973" y="294" class="label">BUILD. LEARN. SHIP.</text>
    </g>
  </g>

  <text x="1136" y="340" text-anchor="end" class="mono micro">*TOKENFLOW AI · OWN BENCHMARK</text>
</svg>
